[project]
name = "wafer-map-yield"
version = "0.1.0"
description = "Wafer bin map yield analysis: spatial signatures, lot excursions, pattern classification"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "matplotlib"]

[project.optional-dependencies]
cnn = ["torch"]
dev = ["pytest"]

[tool.setuptools]
packages = ["wafermap"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
