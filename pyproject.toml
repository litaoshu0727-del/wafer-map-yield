[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wafer-map-yield"
version = "0.1.0"
description = "Wafer bin map yield analysis: spatial signatures, lot excursions, pattern classification"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "matplotlib"]

[project.optional-dependencies]
cnn = ["torch"]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = ["wafermap"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E9", "F"]  # syntax errors and pyflakes (unused imports, undefined names)
